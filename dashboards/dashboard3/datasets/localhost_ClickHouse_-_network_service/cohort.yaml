sql: "SELECT toString(start_date) AS start_date, toString(date) AS active_date, uniqExact(user_id)\
  \ AS active_users FROM (\n    SELECT user_id, MIN(toDate(time)) AS start_date FROM\
  \ feed_actions\n    GROUP BY user_id\n    HAVING toDate('2026-02-12') - MIN(toDate(time))\
  \ <= 21\n  ) t1 \nJOIN (\n    SELECT user_id, toDate(time) AS date FROM feed_actions\n\
  \    WHERE toDate('2026-02-12') - date <= 21\n  ) t2\nUSING user_id\nGROUP BY start_date,\
  \ active_date\nORDER BY start_date ASC, active_date ASC"
