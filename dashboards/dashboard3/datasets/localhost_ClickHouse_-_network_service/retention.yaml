schema: network_service
sql: "SELECT activity_date, source, users * 1.0 / MAX(users) OVER (PARTITION BY source)\
  \ AS retention FROM (\n  SELECT activity_date, source, uniqExact(user_id) AS users\
  \ FROM (\n    SELECT user_id, MIN(toDate(time)) AS start_date, source FROM feed_actions\
  \ \n    GROUP BY user_id, source\n    HAVING start_date = toDate('2025-12-15')\n\
  \  ) t1 \n  JOIN (\n    SELECT user_id, toDate(time) AS activity_date, source FROM\
  \ feed_actions \n    WHERE toDate(time) >= toDate('2025-12-15')\n  ) t2\n  USING\
  \ user_id\n  GROUP BY activity_date, source\n)\nORDER BY source ASC, activity_date\
  \ ASC"
