sql: "WITH new_users AS (\n  SELECT first_date, uniqExact(user_id) AS new_users FROM\
  \ (\n    SELECT user_id, MIN(toStartOfWeek(toDate(time))) AS first_date FROM feed_actions\
  \ \n    GROUP BY user_id\n  ) t1\n  GROUP BY first_date\n),\n\ntotal_users AS (\n\
  \  SELECT toStartOfWeek(time) AS activity_date, uniqExact(user_id) AS total_users\
  \ FROM feed_actions \n  GROUP BY toStartOfWeek(time)\n),\n\ncumulative_new_users\
  \ AS (\n  SELECT first_date, SUM(new_users) OVER (ORDER BY first_date ASC) AS cum_new_users\
  \ FROM new_users\n),\n\ncumulative_total_users AS (\n  SELECT activity_date, SUM(total_users)\
  \ OVER (ORDER BY activity_date ASC) AS cum_total_users FROM total_users\n)\n\nSELECT\
  \ activity_date, (cum_total_users - cum_new_users) * 1.0 / cum_total_users AS old_users,\
  \ \n       cum_new_users * 1.0 / cum_total_users AS new_users\nFROM cumulative_total_users\n\
  JOIN cumulative_new_users ON cumulative_new_users.first_date = cumulative_total_users.activity_date\n\
  ORDER BY activity_date ASC"
